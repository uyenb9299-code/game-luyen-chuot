<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game 2 - Chuột Siêu Tốc</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff8e8;color:#173b5f;font-family:Tahoma,Verdana,Arial,sans-serif}
.top{display:flex;gap:12px;align-items:center;padding:12px 18px;flex-wrap:wrap}.title{font-size:27px;font-weight:900}
.stat{background:#fff;padding:10px 14px;border-radius:9px;font-size:19px;font-weight:800}.right{margin-left:auto}
.btn{border:0;border-radius:10px;background:#4d96ff;color:#fff;font:900 18px Tahoma,Verdana,Arial,sans-serif;padding:13px 19px;cursor:pointer;text-decoration:none;display:inline-block}
.btn2{background:#ff8a5b}.msg{text-align:center;font-size:21px;font-weight:900;padding:4px 8px 10px;min-height:38px}
.board{position:relative;margin:0 14px 14px;height:650px;max-height:calc(100vh - 140px);min-height:480px;background:#bfe9ff;border:4px solid #fff;overflow:hidden;user-select:none;touch-action:none}
.sun{position:absolute;right:4%;top:22px;width:64px;height:64px;border-radius:50%;background:#ffd166}.cloud{position:absolute;width:95px;height:30px;border-radius:30px;background:#fff}
.c1{left:6%;top:52px}.c2{left:35%;top:80px}.c3{right:17%;top:55px}.grass{position:absolute;left:0;right:0;bottom:0;height:78px;background:#c9efaf}
.card{position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);width:min(780px,91%);background:#fff;border:5px solid #79cff0;border-radius:18px;padding:25px;text-align:center}
.card h1,.card h2{margin:0 0 12px;font-size:30px}.card p{font-size:19px;line-height:1.5;font-weight:700}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.demo{height:140px;max-width:540px;margin:14px auto 19px;background:#f5fbff;border:2px dashed #8fcbe6;border-radius:16px;position:relative}
.mouse{position:absolute;width:56px;height:76px;border:4px solid #294e6d;border-radius:28px;background:#fff}.mouse:before{content:"";position:absolute;left:26px;top:0;height:30px;border-left:3px solid #294e6d}.mouse:after{content:"";position:absolute;left:5px;right:5px;top:29px;border-top:3px solid #294e6d}
.pointer{position:absolute;width:0;height:0;border-top:31px solid #173b5f;border-right:20px solid transparent;transform:rotate(-18deg)}
@media(max-width:700px){.title{font-size:21px}.stat{font-size:15px;padding:8px}.card p{font-size:16px}.card h1,.card h2{font-size:25px}.msg{font-size:17px}.board{height:72vh}}

.smalltarget{position:absolute;border-radius:50%;border:4px solid #b65f38;background:#ff9b73;color:#fff;font-size:23px;font-weight:900;cursor:pointer}
.maze{position:absolute;left:8%;top:18%;width:84%;height:55%;background:#315a7b;border-radius:18px;padding:22px}.path{position:relative;width:100%;height:100%;background:#fff;border-radius:12px;clip-path:polygon(0 0,45% 0,45% 28%,78% 28%,78% 0,100% 0,100% 55%,58% 55%,58% 82%,100% 82%,100% 100%,25% 100%,25% 65%,0 65%)}
.startzone,.finishzone{position:absolute;z-index:3;width:90px;height:55px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900}.startzone{left:3%;top:22%;background:#dff3d5}.finishzone{right:3%;bottom:10%;background:#ffd166}
.item,.slot{position:absolute;width:78px;height:78px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}.item{background:#ffb4a2;border:4px solid #d67f6d;cursor:grab}.slot{background:#fff;border:5px dashed #4d8b63}
.choice{position:absolute;width:130px;height:90px;border:4px solid #d59d2b;border-radius:12px;background:#ffd166;font-size:17px;font-weight:900;color:#173b5f;cursor:pointer}
.selectobj{position:absolute;width:65px;height:65px;border-radius:50%;background:#ff9b73;border:4px solid #b65f38}.selection{position:absolute;border:3px dashed #173b5f;background:rgba(255,255,255,.25);pointer-events:none}
</style></head><body>
<div class="top"><a class="btn" href="../">← GAME 1</a><div class="title">GAME 2 - CHUỘT SIÊU TỐC</div><div class="stat">Điểm: <span id="score">0</span></div><div class="stat">Vòng: <span id="round">1/5</span></div><button class="btn right" id="restart">Chơi lại</button></div>
<div class="msg" id="msg">5 thử thách nâng cao đang chờ em.</div>
<div class="board" id="board"><div class="sun deco"></div><div class="cloud c1 deco"></div><div class="cloud c2 deco"></div><div class="cloud c3 deco"></div><div class="grass deco"></div>
<div class="card"><h1>CHUỘT SIÊU TỐC</h1><p>5 vòng nâng cao: mục tiêu nhỏ, đường hẹp, ghép đúng, nháy chính xác và chọn vùng.</p><button class="btn btn2" id="start">BẮT ĐẦU THỬ THÁCH</button></div></div>
<script>
(function(){var B=document.getElementById('board'),S=document.getElementById('score'),R=document.getElementById('round'),M=document.getElementById('msg');var score=0,round=1,done=0,drag=null,ox=0,oy=0,sel=null,sx=0,sy=0;
function clear(){Array.prototype.slice.call(B.children).forEach(function(n){if(!n.classList.contains('deco'))n.remove()})}function hud(){S.textContent=score;R.textContent=round+'/5'}
function guide(t,txt,demo,next){clear();var c=document.createElement('div');c.className='card';c.innerHTML='<h2>'+t+'</h2><p>'+txt+'</p><div class="demo">'+demo+'</div>';var b=document.createElement('button');b.className='btn btn2';b.textContent='EM ĐÃ HIỂU - BẮT ĐẦU';b.onclick=next;c.appendChild(b);B.appendChild(c)}
function g1(){round=1;done=0;hud();M.textContent='HƯỚNG DẪN VÒNG 1';guide('VÒNG 1 - MỤC TIÊU SIÊU TỐC','Nháy thật chính xác vào mục tiêu. Sau mỗi lần, <b>mục tiêu sẽ nhỏ dần</b>.','<div class="mouse" style="left:70px;top:28px"></div><div class="pointer" style="left:250px;top:55px"></div><div style="position:absolute;right:100px;top:42px;width:55px;height:55px;border-radius:50%;background:#ff9b73;border:4px solid #b65f38"></div>',p1)}
function p1(){clear();M.textContent='VÒNG 1: Bắt 12 mục tiêu!';var t=document.createElement('button');t.className='smalltarget';B.appendChild(t);function move(){var size=Math.max(38,78-done*3);t.style.width=size+'px';t.style.height=size+'px';t.textContent=done+1;var w=B.clientWidth,h=B.clientHeight;t.style.left=(25+Math.random()*Math.max(30,w-size-50))+'px';t.style.top=(25+Math.random()*Math.max(30,h-size-170))+'px'}t.onclick=function(){score+=2;done++;hud();if(done>=12){round=2;setTimeout(g2,250)}else move()};move()}
function g2(){done=0;hud();M.textContent='HƯỚNG DẪN VÒNG 2';guide('VÒNG 2 - ĐƯỜNG HẸP','Nhấn vào <b>BẮT ĐẦU</b>, sau đó di chuyển chuột theo đường đến <b>ĐÍCH</b>.<br>Ra khỏi đường sẽ phải làm lại.','<div style="position:absolute;left:40px;right:40px;top:55px;height:30px;background:#315a7b"></div><div class="pointer" style="left:230px;top:50px"></div>',p2)}
function p2(){clear();M.textContent='VÒNG 2: Đi từ BẮT ĐẦU đến ĐÍCH, không ra ngoài đường!';var maze=document.createElement('div');maze.className='maze';var path=document.createElement('div');path.className='path';maze.appendChild(path);var st=document.createElement('button');st.className='startzone';st.textContent='BẮT ĐẦU';var fn=document.createElement('button');fn.className='finishzone';fn.textContent='ĐÍCH';maze.appendChild(st);maze.appendChild(fn);B.appendChild(maze);var active=false;st.onclick=function(){active=true;M.textContent='Đi thật khéo đến ĐÍCH!'};maze.onmouseleave=function(){if(active){active=false;M.textContent='Ra ngoài đường rồi. Bấm BẮT ĐẦU để thử lại!'}};fn.onmouseenter=function(){if(active){active=false;score+=10;hud();round=3;setTimeout(g3,300)}}}
function g3(){done=0;hud();M.textContent='HƯỚNG DẪN VÒNG 3';guide('VÒNG 3 - GHÉP ĐÚNG','Kéo từng chữ sang <b>ô có cùng chữ</b>.<br>Thả sai, chữ sẽ quay về vị trí cũ.','<div style="position:absolute;left:80px;top:35px;width:65px;height:65px;background:#ffb4a2;border:4px solid #d67f6d;border-radius:12px;font-size:30px;font-weight:900;padding-top:12px">A</div><div style="position:absolute;right:80px;top:35px;width:65px;height:65px;background:white;border:4px dashed #4d8b63;border-radius:12px;font-size:30px;font-weight:900;padding-top:12px">A</div><div style="position:absolute;left:230px;top:50px;font-size:35px;font-weight:900">→</div>',p3)}
function p3(){clear();M.textContent='VÒNG 3: Kéo chữ vào đúng ô!';var letters='ABCDE';for(var i=0;i<5;i++){var slot=document.createElement('div');slot.className='slot';slot.dataset.letter=letters[i];slot.textContent=letters[i];slot.style.right='70px';slot.style.top=(35+i*92)+'px';B.appendChild(slot);var d=document.createElement('div');d.className='item';d.textContent=letters[i];d.dataset.homeX='70';d.dataset.homeY=String(35+i*92);d.style.left='70px';d.style.top=(35+i*92)+'px';d.onpointerdown=function(e){drag=this;var r=this.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;e.preventDefault()};B.appendChild(d)}}
B.onpointermove=function(e){if(drag){var r=B.getBoundingClientRect();drag.style.left=Math.max(0,Math.min(B.clientWidth-drag.offsetWidth,e.clientX-r.left-ox))+'px';drag.style.top=Math.max(0,Math.min(B.clientHeight-drag.offsetHeight,e.clientY-r.top-oy))+'px'}else if(sel){var r2=B.getBoundingClientRect(),x=e.clientX-r2.left,y=e.clientY-r2.top;sel.style.left=Math.min(sx,x)+'px';sel.style.top=Math.min(sy,y)+'px';sel.style.width=Math.abs(x-sx)+'px';sel.style.height=Math.abs(y-sy)+'px'}};
B.onpointerup=function(){if(drag){var hit=null,slots=B.querySelectorAll('.slot'),a=drag.getBoundingClientRect();for(var i=0;i<slots.length;i++){var z=slots[i].getBoundingClientRect();if(a.left<z.right&&a.right>z.left&&a.top<z.bottom&&a.bottom>z.top)hit=slots[i]}if(hit&&hit.dataset.letter===drag.textContent){drag.remove();hit.style.background='#dff3d5';score+=3;done++;hud();if(done>=5){round=4;setTimeout(g4,300)}}else{drag.style.left=drag.dataset.homeX+'px';drag.style.top=drag.dataset.homeY+'px';M.textContent='Chưa đúng ô. Thử lại nhé!'}drag=null}};
function g4(){done=0;hud();M.textContent='HƯỚNG DẪN VÒNG 4';guide('VÒNG 4 - 1 LẦN HAY 2 LẦN?','Đọc yêu cầu phía trên.<br>Có lúc em phải <b>nháy 1 lần</b>, có lúc phải <b>nháy đúp</b>.','<div style="position:absolute;left:90px;top:35px;width:115px;height:70px;background:#ffd166;border:4px solid #d59d2b;border-radius:12px;padding-top:20px;font-weight:900">1 LẦN</div><div style="position:absolute;right:90px;top:35px;width:115px;height:70px;background:#ffb4a2;border:4px solid #d67f6d;border-radius:12px;padding-top:20px;font-weight:900">2 LẦN</div>',p4)}
function p4(){clear();M.textContent='VÒNG 4: Làm đúng yêu cầu!';nextChoice()}
function nextChoice(){if(done>=8){round=5;setTimeout(g5,300);return}var old=B.querySelector('.choice');if(old)old.remove();var need=Math.random()<.5?1:2;M.textContent='YÊU CẦU: '+(need===1?'NHÁY 1 LẦN':'NHÁY ĐÚP')+' vào ô.';var f=document.createElement('button');f.className='choice';f.textContent=need===1?'NHÁY 1 LẦN':'NHÁY ĐÚP';f.style.left=(40+Math.random()*Math.max(50,B.clientWidth-190))+'px';f.style.top=(45+Math.random()*Math.max(50,B.clientHeight-240))+'px';var timer=null;f.onclick=function(){if(need===1){timer=setTimeout(function(){score+=3;done++;hud();nextChoice()},260)}else M.textContent='Cần nháy ĐÚP!'};f.ondblclick=function(){if(timer)clearTimeout(timer);if(need===2){score+=3;done++;hud();nextChoice()}else M.textContent='Yêu cầu chỉ NHÁY 1 LẦN!'};B.appendChild(f)}
function g5(){done=0;hud();M.textContent='HƯỚNG DẪN VÒNG 5';guide('VÒNG 5 - CHỌN VÙNG','Nhấn giữ chuột ở vùng trống rồi <b>kéo tạo khung</b> bao quanh các chấm màu.<br>Đây là thao tác chọn vùng thường dùng trên máy tính.','<div style="position:absolute;left:120px;top:35px;width:55px;height:55px;border-radius:50%;background:#ff9b73"></div><div style="position:absolute;left:210px;top:55px;width:55px;height:55px;border-radius:50%;background:#ff9b73"></div><div style="position:absolute;left:95px;top:20px;width:210px;height:105px;border:3px dashed #173b5f"></div>',p5)}
function p5(){clear();M.textContent='VÒNG 5: Kéo một khung bao quanh TẤT CẢ 4 chấm!';var pts=[[180,130],[330,180],[470,120],[570,260]];for(var i=0;i<pts.length;i++){var o=document.createElement('div');o.className='selectobj';o.style.left=pts[i][0]+'px';o.style.top=pts[i][1]+'px';B.appendChild(o)}B.onpointerdown=function(e){if(e.target!==B)return;var r=B.getBoundingClientRect();sx=e.clientX-r.left;sy=e.clientY-r.top;sel=document.createElement('div');sel.className='selection';sel.style.left=sx+'px';sel.style.top=sy+'px';B.appendChild(sel)};B.addEventListener('pointerup',checkSelection,{once:true})}
function checkSelection(){if(!sel)return;var sr=sel.getBoundingClientRect(),objs=B.querySelectorAll('.selectobj'),ok=true;for(var i=0;i<objs.length;i++){var r=objs[i].getBoundingClientRect();if(!(r.left>=sr.left&&r.right<=sr.right&&r.top>=sr.top&&r.bottom<=sr.bottom))ok=false}if(ok){score+=15;hud();setTimeout(fin,300)}else{M.textContent='Khung chưa bao quanh đủ 4 chấm. Thử lại nhé!';sel.remove();sel=null;setTimeout(function(){B.addEventListener('pointerup',checkSelection,{once:true})},0)}}
function fin(){clear();B.onpointerdown=null;M.textContent='HOÀN THÀNH GAME 2!';var c=document.createElement('div');c.className='card';c.innerHTML='<h1>CHÚC MỪNG - CHUỘT SIÊU TỐC!</h1><p>Em đã hoàn thành 5 thử thách nâng cao.<br><b>Tổng điểm: '+score+'</b></p><div class="actions"><button class="btn btn2" id="again">CHƠI LẠI GAME 2</button><a class="btn" href="../">← QUAY VỀ GAME 1</a></div>';B.appendChild(c);document.getElementById('again').onclick=reset}
function reset(){score=0;round=1;done=0;drag=null;sel=null;B.onpointerdown=null;hud();g1()}document.getElementById('start').onclick=g1;document.getElementById('restart').onclick=reset;hud()})();
</script></body></html>
