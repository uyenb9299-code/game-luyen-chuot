<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game 2 - Chuột Siêu Tốc</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef8ff;color:#183b59;font-family:Tahoma,Arial,sans-serif}
button,a{font-family:Tahoma,Arial,sans-serif}
#top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:#fff;border-bottom:3px solid #cbe8f7}
.logo{font-size:27px;font-weight:900}.pill{padding:9px 13px;background:#f4fbff;border:2px solid #b9dced;border-radius:12px;font-size:18px;font-weight:900}
#lives{letter-spacing:2px;color:#e53935}.btn{border:0;border-radius:11px;background:#357edd;color:#fff;padding:12px 17px;font-weight:900;font-size:17px;cursor:pointer;text-decoration:none}.orange{background:#f27a3d}.right{margin-left:auto}
#msg{text-align:center;padding:8px;font-size:20px;font-weight:900;min-height:42px}
#board{position:relative;margin:0 auto 14px;width:calc(100% - 24px);height:650px;max-height:calc(100vh - 145px);min-height:500px;overflow:hidden;border:4px solid #fff;border-radius:18px;background:linear-gradient(#a9ddfa 0 66%,#bce99b 66%);user-select:none;touch-action:none}
.hill{position:absolute;bottom:60px;width:340px;height:150px;border-radius:50% 50% 0 0;background:#91d47a}.h1{left:-70px}.h2{right:-60px;width:430px;background:#83cb70}.ground{position:absolute;left:0;right:0;bottom:0;height:70px;background:#7fc65f}
.sun{position:absolute;right:45px;top:35px;width:62px;height:62px;border-radius:50%;background:#ffd45a;border:5px solid #f4b83f}
.cloud{position:absolute;width:105px;height:32px;border-radius:30px;background:#fff}.c1{left:7%;top:65px}.c2{left:37%;top:40px}
.panel{position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(800px,92%);background:#fff;border:5px solid #5fb8e8;border-radius:22px;padding:25px;text-align:center;box-shadow:0 8px 0 rgba(28,89,120,.15)}
.panel h1{margin:0 0 10px;font-size:34px}.panel h2{margin:0 0 10px;font-size:28px}.panel p{font-size:19px;line-height:1.5;font-weight:700;margin:9px 0 17px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.demo{height:145px;position:relative;max-width:560px;margin:13px auto 18px;background:#f4fbff;border:3px dashed #a4d5ec;border-radius:16px}
.mouse{position:absolute;width:55px;height:75px;border:4px solid #31506a;border-radius:27px;background:#fff}.mouse:before{content:"";position:absolute;left:26px;top:0;height:29px;border-left:3px solid #31506a}.mouse:after{content:"";position:absolute;left:5px;right:5px;top:29px;border-top:3px solid #31506a}
.cursor{position:absolute;width:0;height:0;border-top:31px solid #173b5f;border-right:20px solid transparent;transform:rotate(-18deg)}
.target{position:absolute;border-radius:50%;background:#ff6b5e;border:7px solid #fff;outline:5px solid #d83f36;cursor:pointer;color:#fff;font-weight:900;font-size:22px}
.target:after{content:"";position:absolute;inset:24%;border-radius:50%;border:6px solid #fff}
.mazeWrap{position:absolute;left:5%;right:5%;top:10%;bottom:12%;background:#477a45;border:9px solid #315f36;border-radius:24px;overflow:hidden}
.safe{position:absolute;background:#f5d79e;border:5px solid #ffe9bd}
.startZone,.finishZone{position:absolute;z-index:6;width:92px;height:48px;border:0;border-radius:10px;font-weight:900;font-size:14px}.startZone{left:2%;top:5%;background:#e7f7d8}.finishZone{right:2%;bottom:5%;background:#ffd45a}
.item,.slot{position:absolute;width:82px;height:82px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900}.item{background:#fff;border:5px solid #ff966e;cursor:grab}.slot{background:#fff8df;border:5px dashed #4f9b62;transition:top .7s linear}.slot.moving{animation:slotMove 3.2s ease-in-out infinite alternate}@keyframes slotMove{from{transform:translateY(-24px)}to{transform:translateY(24px)}}
.choice{position:absolute;width:135px;height:95px;border:5px solid #d99f30;border-radius:18px;background:#ffd45a;color:#183b59;font-weight:900;font-size:17px;cursor:pointer}
.sea{position:absolute;left:7%;right:7%;top:13%;bottom:12%;border-radius:24px;background:#7dd8ef;border:8px solid #fff;overflow:hidden}
.fish{position:absolute;width:70px;height:55px;border-radius:55% 45% 45% 55%;background:#ff8d65;border:4px solid #d76043}.fish:after{content:"";position:absolute;right:-24px;top:10px;border-left:28px solid #d76043;border-top:16px solid transparent;border-bottom:16px solid transparent}
.selectBox{position:absolute;border:4px dashed #1d5da4;background:rgba(255,255,255,.18);pointer-events:none}
.flash{animation:flash .25s 2}@keyframes flash{50%{filter:brightness(1.4)}}
@media(max-width:720px){.logo{font-size:20px}.pill{font-size:14px;padding:7px}.panel h1{font-size:27px}.panel p{font-size:16px}#msg{font-size:17px}}
</style>
</head>
<body>
<div id="top">
<a class="btn" href="../">GAME 1</a>
<div class="logo">GAME 2 - CHUỘT SIÊU TỐC</div>
<div class="pill">Mạng: <span id="lives">10/10</span></div>
<div class="pill">Điểm: <span id="score">0</span></div>
<div class="pill">Vòng: <span id="round">1/5</span></div>
<button id="restart" class="btn right">Chơi lại</button>
</div>
<div id="msg">Nhanh hơn - Chính xác hơn - Thử thách hơn!</div>
<div id="board">
<div class="sun deco"></div><div class="cloud c1 deco"></div><div class="cloud c2 deco"></div><div class="hill h1 deco"></div><div class="hill h2 deco"></div><div class="ground deco"></div>
<div class="panel">
<h1>CHUỘT SIÊU TỐC</h1>
<p>Em có <b>10 mạng</b>. Bấm hụt hoặc thao tác sai sẽ mất 1 mạng.<br>Vượt qua 5 thử thách nâng cao để trở thành cao thủ điều khiển chuột!</p>
<div class="actions"><button id="start" class="btn orange">BẮT ĐẦU NGAY</button></div>
</div>
</div>
<script>
(function(){
var B=document.getElementById('board'),S=document.getElementById('score'),L=document.getElementById('lives'),R=document.getElementById('round'),M=document.getElementById('msg');
var score=0,lives=10,round=1,done=0,drag=null,ox=0,oy=0,targetTimer=null,selecting=false,sel=null,sx=0,sy=0,mazeActive=false;
function clearTimer(){if(targetTimer){clearTimeout(targetTimer);targetTimer=null}}
function clear(){clearTimer();Array.prototype.slice.call(B.children).forEach(function(n){if(!n.classList.contains('deco'))n.remove()});drag=null;selecting=false;sel=null;mazeActive=false;B.onpointerdown=null}
function hud(){S.textContent=score;L.textContent=lives+'/10';R.textContent=round+'/5'}
function lose(reason){if(lives<=0)return;lives--;hud();M.textContent=reason+' - Mất 1 mạng!';B.classList.add('flash');setTimeout(function(){B.classList.remove('flash')},400);if(lives<=0)setTimeout(gameOver,350)}
function panel(title,text,demo,next){clear();var p=document.createElement('div');p.className='panel';p.innerHTML='<h2>'+title+'</h2><p>'+text+'</p><div class="demo">'+demo+'</div>';var b=document.createElement('button');b.className='btn orange';b.textContent='EM ĐÃ HIỂU - BẮT ĐẦU';b.onclick=next;p.appendChild(b);B.appendChild(p)}
function gameOver(){clear();M.textContent='HẾT MẠNG!';var p=document.createElement('div');p.className='panel';p.innerHTML='<h1>HẾT 10 MẠNG</h1><p>Điểm của em: <b>'+score+'</b><br>Chơi lại và thử điều khiển chuột chính xác hơn nhé!</p><div class="actions"><button class="btn orange" id="again">CHƠI LẠI</button><a class="btn" href="../">VỀ GAME 1</a></div>';B.appendChild(p);document.getElementById('again').onclick=reset}
function g1(){round=1;done=0;hud();M.textContent='HƯỚNG DẪN VÒNG 1';panel('VÒNG 1 - BẮN MỤC TIÊU','Mục tiêu sẽ <b>nhỏ dần và đổi vị trí nhanh</b>.<br>Nháy đúng được điểm. <b>Bấm hụt hoặc để mục tiêu biến mất: mất 1 mạng.</b>','<div class="mouse" style="left:70px;top:30px"></div><div class="cursor" style="left:245px;top:58px"></div><div style="position:absolute;right:90px;top:35px;width:70px;height:70px;border-radius:50%;background:#ff6b5e;border:7px solid white;outline:5px solid #d83f36"></div>',p1)}
function p1(){clear();M.textContent='VÒNG 1: Bắt 15 mục tiêu - nhanh nhưng phải chính xác!';B.onclick=function(e){if(e.target===B){lose('Bấm hụt');if(lives<=0)B.onclick=null}};spawnTarget()}
function spawnTarget(){if(lives<=0||done>=15){B.onclick=null;if(done>=15){round=2;setTimeout(g2,350)}return}var old=B.querySelector('.target');if(old)old.remove();var t=document.createElement('button');t.className='target';var size=Math.max(38,78-done*2.5);t.style.width=size+'px';t.style.height=size+'px';t.style.left=(25+Math.random()*Math.max(30,B.clientWidth-size-50))+'px';t.style.top=(25+Math.random()*Math.max(30,B.clientHeight-size-180))+'px';t.textContent=done+1;t.onclick=function(e){e.stopPropagation();clearTimer();score+=2;done++;hud();t.remove();spawnTarget()};B.appendChild(t);targetTimer=setTimeout(function(){if(t.parentNode){t.remove();lose('Chậm rồi');if(lives>0)spawnTarget()}},Math.max(950,1650-done*35))}
function g2(){B.onclick=null;done=0;hud();M.textContent='HƯỚNG DẪN VÒNG 2';panel('VÒNG 2 - MÊ CUNG CON TRỎ','Bấm <b>BẮT ĐẦU</b> rồi đưa con trỏ theo đường đến <b>ĐÍCH</b>.<br><b>Chạm hoặc ra khỏi đường: mất 1 mạng.</b>','<div style="position:absolute;left:50px;right:50px;top:55px;height:32px;background:#f4d39a;border:7px solid #5d8c54;border-radius:15px"></div><div class="cursor" style="left:250px;top:50px"></div>',p2)}
function p2(){clear();M.textContent='VÒNG 2: Bấm BẮT ĐẦU rồi đi trong đường màu vàng đến ĐÍCH!';var mw=document.createElement('div');mw.className='mazeWrap';B.appendChild(mw);
var segs=[
[3,8,58,12],[52,8,9,28],[52,29,34,12],[78,29,8,28],
[31,49,55,12],[31,49,8,27],[31,69,42,12],[66,69,8,20],
[66,81,29,12]
];
for(var i=0;i<segs.length;i++){var s=document.createElement('div');s.className='safe';s.style.left=segs[i][0]+'%';s.style.top=segs[i][1]+'%';s.style.width=segs[i][2]+'%';s.style.height=segs[i][3]+'%';mw.appendChild(s)}
var st=document.createElement('button');st.className='startZone';st.textContent='BẮT ĐẦU';var fn=document.createElement('button');fn.className='finishZone';fn.textContent='ĐÍCH';mw.appendChild(st);mw.appendChild(fn);
st.onclick=function(e){e.stopPropagation();mazeActive=true;M.textContent='Đi trong đường vàng. Chạm vùng xanh sẽ mất 1 mạng!'};
mw.onmousemove=function(e){if(!mazeActive)return;if(e.target===mw){mazeActive=false;lose('Chạm thành mê cung');M.textContent='Mất 1 mạng. Bấm BẮT ĐẦU để thử lại!'}};
fn.onmouseenter=function(){if(mazeActive&&lives>0){mazeActive=false;score+=12;hud();round=3;setTimeout(g3,350)}};
mw.onmouseleave=function(){if(mazeActive){mazeActive=false;lose('Ra khỏi mê cung');M.textContent='Bấm BẮT ĐẦU để thử lại!'}}}
function g3(){done=0;hud();M.textContent='HƯỚNG DẪN VÒNG 3';panel('VÒNG 3 - KÉO THẢ ĐÚNG VỊ TRÍ','Kéo từng chữ sang <b>ô có cùng chữ đang di chuyển</b>.<br>Phải căn đúng thời điểm. <b>Thả sai hoặc hụt: mất 1 mạng.</b>','<div style="position:absolute;left:85px;top:35px;width:70px;height:70px;border-radius:15px;background:white;border:5px solid #ff966e;font-size:35px;font-weight:900;padding-top:10px">A</div><div style="position:absolute;left:250px;top:52px;font-size:36px;font-weight:900">→</div><div style="position:absolute;right:85px;top:35px;width:70px;height:70px;border-radius:15px;background:#fff8df;border:5px dashed #4f9b62;font-size:35px;font-weight:900;padding-top:10px">A</div>',p3)}
function p3(){clear();M.textContent='VÒNG 3: Các ô đích đang di chuyển - hãy căn thật chính xác!';var letters='ABCDEF';for(var i=0;i<6;i++){var slot=document.createElement('div');slot.className='slot moving';slot.style.animationDelay=(-i*0.42)+'s';slot.dataset.letter=letters.charAt(i);slot.textContent=letters.charAt(i);slot.style.right='75px';slot.style.top=(22+i*88)+'px';B.appendChild(slot);var d=document.createElement('div');d.className='item';d.textContent=letters.charAt(i);d.dataset.homeX='75';d.dataset.homeY=String(22+i*88);d.style.left='75px';d.style.top=(22+i*88)+'px';d.onpointerdown=function(e){drag=this;var r=this.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;e.preventDefault()};B.appendChild(d)}}
B.onpointermove=function(e){if(drag){var r=B.getBoundingClientRect();drag.style.left=Math.max(0,Math.min(B.clientWidth-drag.offsetWidth,e.clientX-r.left-ox))+'px';drag.style.top=Math.max(0,Math.min(B.clientHeight-drag.offsetHeight,e.clientY-r.top-oy))+'px'}else if(selecting&&sel){var r2=B.getBoundingClientRect(),x=e.clientX-r2.left,y=e.clientY-r2.top;sel.style.left=Math.min(sx,x)+'px';sel.style.top=Math.min(sy,y)+'px';sel.style.width=Math.abs(x-sx)+'px';sel.style.height=Math.abs(y-sy)+'px'}};
B.onpointerup=function(){if(drag){var hit=null,slots=B.querySelectorAll('.slot'),a=drag.getBoundingClientRect();for(var i=0;i<slots.length;i++){var z=slots[i].getBoundingClientRect();if(a.left<z.right&&a.right>z.left&&a.top<z.bottom&&a.bottom>z.top)hit=slots[i]}if(hit&&hit.dataset.letter===drag.textContent){drag.remove();hit.style.background='#d9f5d7';score+=3;done++;hud();if(done>=6){round=4;setTimeout(g4,350)}}else{drag.style.left=drag.dataset.homeX+'px';drag.style.top=drag.dataset.homeY+'px';lose('Thả sai')}drag=null}else if(selecting){finishSelection()}};
function g4(){done=0;hud();M.textContent='HƯỚNG DẪN VÒNG 4';panel('VÒNG 4 - NHÁY ĐƠN HAY NHÁY ĐÚP?','Đọc yêu cầu rồi nháy vào ô.<br>Game sẽ chờ khoảng <b>0,4 giây</b> để phân biệt nháy đơn và nháy đúp.<br><b>Sai thao tác hoặc bấm hụt: mất 1 mạng.</b>','<div style="position:absolute;left:80px;top:35px;width:130px;height:72px;border-radius:15px;background:#ffd45a;border:5px solid #d99f30;padding-top:20px;font-weight:900">NHÁY 1 LẦN</div><div style="position:absolute;right:80px;top:35px;width:130px;height:72px;border-radius:15px;background:#ff9b73;border:5px solid #d76043;padding-top:20px;font-weight:900">NHÁY 2 LẦN</div>',p4)}
function p4(){clear();M.textContent='VÒNG 4: Hoàn thành 10 yêu cầu!';B.onclick=function(e){if(e.target===B)lose('Bấm hụt')};nextChoice()}
function nextChoice(){if(lives<=0)return;if(done>=10){B.onclick=null;round=5;setTimeout(g5,350);return}
var old=B.querySelector('.choice');if(old)old.remove();
var need=Math.random()<.5?1:2;
M.textContent='YÊU CẦU: '+(need===1?'NHÁY 1 LẦN':'NHÁY ĐÚP')+' vào ô';
var f=document.createElement('button');f.className='choice';
f.textContent=need===1?'NHÁY 1 LẦN':'NHÁY ĐÚP';
f.style.left=(40+Math.random()*Math.max(40,B.clientWidth-200))+'px';
f.style.top=(45+Math.random()*Math.max(40,B.clientHeight-250))+'px';

var clickCount=0, clickTimer=null, locked=false;
function judge(){
 if(locked)return;
 locked=true;
 var action=(clickCount>=2)?2:1;
 clickCount=0;
 if(action===need){
   score+=3;done++;hud();
   M.textContent='CHÍNH XÁC!';
   setTimeout(nextChoice,220);
 }else{
   lose('Sai thao tác');
   if(lives>0){
     M.textContent='Sai thao tác. Hãy đọc kỹ yêu cầu tiếp theo!';
     setTimeout(nextChoice,420);
   }
 }
}
f.onclick=function(e){
 e.stopPropagation();
 if(locked)return;
 clickCount++;
 if(clickCount===1){
   clickTimer=setTimeout(judge,400);
 }else if(clickCount===2){
   if(clickTimer)clearTimeout(clickTimer);
   setTimeout(judge,35);
 }
};
f.ondblclick=function(e){e.preventDefault();e.stopPropagation()};
B.appendChild(f)}
function g5(){B.onclick=null;done=0;hud();M.textContent='HƯỚNG DẪN VÒNG 5';panel('VÒNG 5 - CHỌN ĐÚNG VÙNG','Nhấn giữ chuột ở vùng nước và kéo tạo khung bao quanh <b>tất cả 4 con cá</b>.<br><b>Chọn thiếu hoặc chọn sai: mất 1 mạng.</b>','<div style="position:absolute;left:70px;right:70px;top:22px;bottom:22px;background:#7dd8ef;border-radius:15px"></div><div style="position:absolute;left:115px;top:48px;width:55px;height:42px;border-radius:50%;background:#ff8d65"></div><div style="position:absolute;left:95px;top:32px;width:230px;height:85px;border:3px dashed #1d5da4"></div>',p5)}
function p5(){clear();M.textContent='VÒNG 5: Kéo khung bao quanh đủ 4 con cá!';var sea=document.createElement('div');sea.className='sea';B.appendChild(sea);var pts=[[16,20],[42,33],[65,18],[72,60]];for(var i=0;i<pts.length;i++){var fish=document.createElement('div');fish.className='fish';fish.style.left=pts[i][0]+'%';fish.style.top=pts[i][1]+'%';sea.appendChild(fish)}B.onpointerdown=function(e){if(e.target!==sea)return;var r=B.getBoundingClientRect();sx=e.clientX-r.left;sy=e.clientY-r.top;selecting=true;sel=document.createElement('div');sel.className='selectBox';sel.style.left=sx+'px';sel.style.top=sy+'px';B.appendChild(sel)}}
function finishSelection(){if(!sel)return;selecting=false;var sr=sel.getBoundingClientRect(),objs=B.querySelectorAll('.fish'),ok=true;for(var i=0;i<objs.length;i++){var r=objs[i].getBoundingClientRect();if(!(r.left>=sr.left&&r.right<=sr.right&&r.top>=sr.top&&r.bottom<=sr.bottom))ok=false}if(ok){score+=20;hud();setTimeout(fin,350)}else{sel.remove();sel=null;lose('Chọn chưa đủ');M.textContent='Chưa đủ 4 con cá. Kéo lại nhé!'}}
function fin(){clear();M.textContent='HOÀN THÀNH GAME 2!';var p=document.createElement('div');p.className='panel';p.innerHTML='<h1>CHÚC MỪNG!</h1><p>Em đã vượt qua 5 thử thách Chuột Siêu Tốc.<br><b>Điểm: '+score+'</b><br><b>Mạng còn lại: '+lives+'/10</b></p><div class="actions"><button class="btn orange" id="again">CHƠI LẠI GAME 2</button><a class="btn" href="../">VỀ GAME 1</a></div>';B.appendChild(p);document.getElementById('again').onclick=reset}
function reset(){score=0;lives=10;round=1;done=0;clear();hud();g1()}
document.getElementById('start').onclick=g1;document.getElementById('restart').onclick=reset;hud();
})();
</script>
</body></html>
